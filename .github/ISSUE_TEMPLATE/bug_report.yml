name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：
        - 已阅读 `LIORAN.md` 的铁律（有些「问题」其实是设计取舍）
        - 已运行 `node test/smoke.js` 并贴出结果
        - 如果是安全问题，**不要开公开 issue**，见 `SECURITY.md`

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象与预期分别是什么
      placeholder: 我执行了……期望……实际……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给最小可复现输入（命令、请求体、或最小的 HTML 片段）
      placeholder: |
        1. node api/server.js
        2. curl -X POST ...
        3. 看到 ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - api/server.js（本地规则引擎）
        - api/contract.md（接口契约）
        - preview/（工作台与 demo）
        - registry/（组件素材库）
        - design/（设计 token 与规则）
        - LIORAN.md（工作手册）
        - 其他

  - type: input
    id: node
    attributes:
      label: Node 版本
      placeholder: 输出 node -v
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: macOS 15.1 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息与自检输出
      description: 粘贴终端输出
      render: shell
